spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5436/analyzer
    username: postgres
    password: password
  sql:
    init:
      mode: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: localhost:9092
    event-consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: ru.practicum.deserializer.EventSimilarityDeserializer
      group-id: analyzer.group.id
      client-id: AnalyzerConsumer
      enable-auto-commit: false
    user-consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.deserializer.UserActionDeserializer
      group-id: analyzer.group.id
      client-id: AnalyzerConsumer
      enable-auto-commit: false

kafka:
  user-consumer:
    topic: stats.user-actions.v1
  event-consumer:
    topic: stats.events-similarity.v1

grpc:
  server:
    port: 0
  client:
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
