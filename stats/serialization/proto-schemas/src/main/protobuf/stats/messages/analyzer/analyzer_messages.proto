syntax = "proto3";

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.recommendations";
package stats.message;

message UserPredictionsRequestProto {
  int32 user_id = 1;
  int32 max_results = 2;
}

message SimilarEventsRequestProto {
  int32 event_id = 1;
  int32 user_id = 2;
  int32 max_results = 3;
}

message InteractionsCountRequestProto {
  int32 event_id = 1;
}

message RecommendedEventProto {
  int32 event_id = 1;
  double score = 2;
}